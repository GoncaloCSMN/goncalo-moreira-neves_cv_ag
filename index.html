<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gonçalo Moreira Neves - CV</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* Canopy tokens (Gaussem-Neves palette). Light is the default; dark only via data-theme="dark". */
  :root{
    color-scheme:light;
    --canvas:#FAF6F1; --surface:#FFFFFF; --inset:#F2EFE9; --sand:#F5DEC9; --sand-50:#F2EDE8;
    --text:#1D1D1B; --text-2:#55524E; --text-3:#6E6B67;
    --line:#E6E2DD; --line-2:#D1CDC8;
    --ocean:#336699; --ocean-6:#15558F; --ocean-7:#00467D; --ocean-8:#043762; --ocean-1:#CDDCED;
    --sun:#FC9B2C; --sun-3:#FEBC76; --sun-7:#8B5300;
    --chip-bg:#F2EDE8; --chip-fg:#3A3733;
    --win-bg:#FAF6F1;
    --shadow:0 4px 12px rgba(29,29,27,.08),0 2px 4px rgba(29,29,27,.05);
    --font:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
    --brand:"Sofia Sans Extra Condensed","Manrope",sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --canvas:#0E0C09; --surface:#161310; --inset:#0E0C09; --sand:#342B22; --sand-50:#25221F;
    --text:#EEEBE6; --text-2:#B3B1AC; --text-3:#8E8C87;
    --line:#25221F; --line-2:#34312E;
    --ocean:#71A1D3; --ocean-6:#9DBEE2; --ocean-7:#9DBEE2; --ocean-8:#082948; --ocean-1:#082948;
    --sun:#FC9B2C; --sun-3:#FEBC76; --sun-7:#FEBC76;
    --chip-bg:#25221F; --chip-fg:#D7D4CF;
    --win-bg:#1B1916;
    --shadow:0 4px 12px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--canvas)}
  body{font-family:var(--font); font-weight:500; color:var(--text); line-height:1.5;
       -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
  b{font-weight:700}
  .page{max-width:1000px; margin:24px auto; background:var(--surface); box-shadow:var(--shadow);
        border:1px solid var(--line); border-radius:16px; overflow:hidden}

  /* ---------- Header (the one gradient hero surface) ---------- */
  header{background:linear-gradient(135deg,#336699 0%,#043762 100%); color:#fff; padding:30px 36px 24px; position:relative}
  header::after{content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
                background:linear-gradient(90deg,var(--sun) 0 34%,var(--sun-3) 34% 58%,#FF6666 58% 78%,#00CCFF 78% 100%)}
  .head-top{display:flex; align-items:flex-start; gap:18px}
  .monogram{flex:none; width:56px; height:56px; border-radius:50%; border:2px solid var(--sun-3);
            display:flex; align-items:center; justify-content:center;
            font-family:var(--brand); font-weight:600; font-size:24px; letter-spacing:.08em; color:#FEBC76}
  [hidden]{display:none !important}
  .photo{flex:none; width:68px; height:68px; border-radius:50%; object-fit:cover; border:2px solid var(--sun-3); background:#043762}
  .ctlrow{display:flex; gap:6px}
  a.iconbtn{text-decoration:none}
  .head-id{flex:1; min-width:0}
  header h1{font-family:var(--brand); font-weight:600; font-size:44px; line-height:1; letter-spacing:.06em; text-transform:uppercase}
  .tagline{margin-top:6px; font-size:15px; font-weight:600; color:#DCECFD}
  .role{margin-top:14px; font-size:13px; font-weight:600; color:#FEE6CE}
  .role .sep{color:var(--sun); margin:0 6px}
  .contact{margin-top:12px; display:flex; flex-wrap:wrap; gap:6px 22px; font-size:12.5px}
  .contact a{color:#fff; text-decoration:none; border-bottom:1px solid rgba(254,188,118,.7)}
  .contact a:hover{border-bottom-color:#fff}
  .contact span{color:#E6EEF7}
  .contact i{font-style:normal; color:#FEBC76; font-weight:700; margin-right:6px}

  /* ---------- Controls (top right) ---------- */
  .controls{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
  .ctlgroup{display:flex; gap:2px; background:rgba(255,255,255,.10); border:1px solid rgba(254,188,118,.55); border-radius:9999px; padding:3px}
  .ctlgroup button,.iconbtn{font:inherit; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
       color:#FEE6CE; background:transparent; border:0; border-radius:9999px; padding:5px 11px; cursor:pointer;
       transition:background 120ms cubic-bezier(.4,0,.2,1)}
  .ctlgroup button:hover,.iconbtn:hover{background:rgba(255,255,255,.12)}
  .ctlgroup button[aria-pressed="true"]{background:#FC9B2C; color:#1D1D1B}
  .iconbtn{background:rgba(255,255,255,.10); border:1px solid rgba(254,188,118,.55); display:inline-flex; align-items:center; gap:6px; padding:6px 13px}
  .iconbtn svg{width:13px; height:13px; fill:currentColor}
  button:focus-visible{outline:2px solid #fff; outline-offset:2px}

  /* ---------- Layout ---------- */
  .body{display:grid; grid-template-columns:320px 1fr}
  aside{background:var(--canvas); padding:24px 22px; border-right:1px solid var(--line)}
  main{padding:24px 30px}
  section{margin-bottom:22px}
  h2{font-family:var(--brand); font-size:16px; line-height:1.1; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
     color:var(--ocean-7); margin:0 0 11px; padding-bottom:5px; border-bottom:2px solid var(--sun)}

  /* ---------- Justified running text ---------- */
  .summary p,.job .desc,.job li,.vent .vdesc{text-align:justify; text-justify:inter-word; hyphens:auto; -webkit-hyphens:auto}

  .summary{font-size:13.5px; color:var(--text-2)}
  .summary p{margin-bottom:9px}
  .summary p:last-child{margin-bottom:0}
  .summary b{color:var(--text)}

  /* ---------- Key results ---------- */
  .wins{display:grid; grid-template-columns:1fr; gap:7px}
  .win{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 11px}
  .win b{display:block; color:var(--ocean-7); font-size:13px; font-weight:800; margin-bottom:1px}
  .win span{display:block; font-size:11.5px; color:var(--text-3); line-height:1.4}

  .pillar{margin-bottom:12px}
  .pillar:last-child{margin-bottom:0}
  .pillar h3{font-size:12px; font-weight:800; color:var(--ocean-7); margin-bottom:6px}
  .pillar .wins{grid-template-columns:repeat(3,1fr)}
  .inv{margin-bottom:9px; font-size:13px; color:var(--text-2)}
  .inv:last-child{margin-bottom:0}
  .inv b{display:block; color:var(--text); font-weight:800; font-size:13.5px}
  .inv span{display:block; text-align:justify; hyphens:auto}
  a.org{color:inherit; text-decoration:none; border-bottom:1px dotted var(--ocean)}
  a.org:hover{color:var(--ocean-6)}
  /* ---------- Experience ---------- */
  .job{margin-bottom:16px}
  .job:last-child{margin-bottom:0}
  .job .top{display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 12px; align-items:baseline}
  .job .title{font-size:14.5px; font-weight:800; color:var(--text)}
  .job .co{font-weight:700; color:var(--ocean-6)}
  .job .meta{font-size:11.5px; color:var(--text-3); white-space:nowrap; font-weight:600}
  .job .desc{font-size:12.5px; color:var(--text-3); font-style:italic; margin:3px 0 7px}
  .job ul{list-style:none}
  .job li{position:relative; padding-left:15px; font-size:13px; margin-bottom:4px; color:var(--text-2)}
  .job li::before{content:""; position:absolute; left:2px; top:7.5px; width:5px; height:5px; background:var(--sun); border-radius:50%}
  .job li b{color:var(--text)}

  .vent{margin-top:8px; padding-left:14px; border-left:2px solid var(--sand)}
  .vent .vrow{margin-bottom:8px}
  .vent .vrow:last-child{margin-bottom:0}
  .vent .vtitle{font-size:13px; font-weight:800; color:var(--text)}
  .vent .vtitle .co2{color:var(--ocean-6)}
  .vent .vmeta{font-size:11px; color:var(--text-3); font-weight:600; margin-left:6px; white-space:nowrap}
  .vent .vdesc{font-size:12.5px; color:var(--text-2); margin-top:1px}
  .vent .vdesc b{color:var(--text)}

  /* ---------- Skills ---------- */
  .skillgroup{margin-bottom:12px}
  .skillgroup:last-child{margin-bottom:0}
  .skillgroup h3{font-size:12px; color:var(--ocean-7); font-weight:800; margin-bottom:6px}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chips span{background:var(--chip-bg); color:var(--chip-fg); font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:6px; border:1px solid var(--line)}

  /* ---------- Lists ---------- */
  .edu{font-size:12.5px; margin-bottom:9px; color:var(--text-2)}
  .edu b{display:block; color:var(--text)}
  .edu span{display:block; color:var(--text-3); font-size:11.5px}
  .pub{padding-left:14px; position:relative; font-size:12.5px; margin-bottom:9px; color:var(--text-2)}
  .pub b{color:var(--text)}
  .pub span{display:block; color:var(--text-3); font-size:11.5px; margin-top:1px}
  .pub::before,ul.plain li::before{content:""; position:absolute; left:0; top:7px; width:5px; height:5px; background:var(--sun); border-radius:50%}
  .lang{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; color:var(--text)}
  .lang span{color:var(--text-3)}
  ul.plain{list-style:none}
  ul.plain li{position:relative; padding-left:14px; font-size:12.5px; margin-bottom:5px; color:var(--text-2)}
  .tail{display:grid; grid-template-columns:1fr 1fr; gap:0 26px}
  .print-grid{display:block}
  .lastsec{margin-bottom:0}
  .body > main{grid-column:2; grid-row:1}
  .body > aside{grid-column:1; grid-row:1}
  main .wins{grid-template-columns:repeat(3,1fr)}

  footer{padding:12px 36px; background:var(--canvas); border-top:1px solid var(--line);
         font-size:11px; color:var(--text-3); text-align:center}
  footer .flinks{display:flex; flex-wrap:wrap; justify-content:center; gap:2px 0}
  footer .flinks a{color:var(--ocean); text-decoration:none; font-weight:600}
  footer .flinks a:hover{text-decoration:underline}
  footer .fsep{color:var(--sun); padding:0 8px}
  footer .fdate{margin-top:3px}

  @media (max-width:860px){
    .head-top{flex-wrap:wrap}
    .controls{order:-1; width:100%; flex-direction:row; flex-wrap:wrap; justify-content:flex-end; align-items:center}
  }
  @media (max-width:760px){
    .page{margin:0; border-radius:0; border:0}
    .body{grid-template-columns:1fr}
    .body > main,.body > aside{grid-column:1; grid-row:auto}
    main .wins,.pillar .wins{grid-template-columns:1fr}
    .tail{grid-template-columns:1fr}
    aside{border-right:none; border-top:1px solid var(--line); order:2}
    main{order:1}
    header{padding:24px 16px 20px}
    main,aside{padding:20px 16px}
    header h1{font-size:34px}
  }

  /* ---------- Print: A4, normal margins, single flowing column, no gaps ---------- */
  @page{size:A4; margin:20mm 20mm 20mm 20mm}
  @media print{
    :root,:root[data-theme="dark"]{
      --canvas:#FAF6F1; --surface:#FFFFFF; --sand:#F5DEC9; --text:#1D1D1B; --text-2:#3A3733; --text-3:#55524E;
      --line:#E6E2DD; --ocean:#336699; --ocean-6:#15558F; --ocean-7:#00467D; --chip-bg:#F2EDE8; --chip-fg:#3A3733; --win-bg:#FAF6F1;
    }
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    html,body{background:#fff}
    .page{box-shadow:none; margin:0; max-width:none; border:0; border-radius:0; overflow:visible}
    .controls{display:none !important}
    header{border-radius:12px; padding:20px 22px 18px; overflow:hidden}
    header h1{font-size:38px}
    .body{display:block}
    main{padding:14px 0 0}
    aside{padding:0; margin-top:18px; background:none; border:0}
    section{margin-bottom:14px}
    h2{break-after:avoid; page-break-after:avoid}
    .summary{font-size:12.5px; line-height:1.5}
    .job li{font-size:12px; margin-bottom:3px}
    .job .desc{font-size:11.5px; margin:2px 0 5px}
    .job{margin-bottom:12px}
    .vent .vdesc{font-size:12px}
    .chips span{font-size:10.5px; padding:2px 8px}
    .win span{font-size:11px}
    .wins.many{grid-template-columns:repeat(4,1fr)}
    .pillar,.inv{break-inside:avoid; page-break-inside:avoid}
    .inv{font-size:12px; margin-bottom:6px}
    .inv b{font-size:12.5px}
    a.org{border-bottom:0}
    body{line-height:1.4}
    .summary{line-height:1.45}
    .summary p{margin-bottom:6px}
    section{margin-bottom:11px}
    .job .top,.job .desc{break-inside:avoid; page-break-inside:avoid}
    .chips{gap:4px}
    .skillgroup{margin-bottom:8px}
    .edu,.pub{margin-bottom:6px}
    ul.plain li{margin-bottom:3px}
    .lang{margin-bottom:2px}
    .win{padding:6px 9px}
    .job{break-inside:auto}
    .job .top,.job .desc{break-after:avoid; page-break-after:avoid}
    .job li,.vent .vrow,.edu,.pub,.win,.skillgroup{break-inside:avoid; page-break-inside:avoid}
    .wins{grid-template-columns:repeat(3,1fr); gap:6px}
    .win{background:var(--win-bg)}
    .print-grid{display:block; column-count:2; column-gap:24px; column-fill:balance}
    .print-grid section{break-inside:auto}
    .print-grid .lastsec{margin-bottom:16px}
    .print-grid > div:last-child .lastsec{margin-bottom:0}
    footer{background:none; border-top:1px solid var(--line); padding:8px 0 0; margin-top:4px; break-inside:avoid; page-break-inside:avoid}
    footer .flinks a{color:var(--ocean-6)}
    a{color:inherit}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="head-top">
      <img class="photo" id="photo" alt="Gonçalo Moreira Neves" hidden>
      <div class="monogram" id="mono" aria-hidden="true">GN</div>
      <div class="head-id">
        <h1>Gonçalo Moreira Neves</h1>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="controls">
        <div class="ctlgroup" id="langs" role="group" aria-label="Language"></div>
        <div class="ctlrow">
          <a class="iconbtn" id="atsDocx" download></a>
          <a class="iconbtn" id="atsPdf" download></a>
        </div>
        <div class="ctlrow">
          <button class="iconbtn" id="themeBtn" type="button"></button>
          <button class="iconbtn" id="printBtn" type="button"></button>
        </div>
      </div>
    </div>
    <div class="role" id="roleline"></div>
    <div class="contact" id="contact"></div>

  <div class="body">
    <main>
      <section><h2 id="h-profile"></h2><div class="summary" id="profile"></div></section>
      <section><h2 id="h-results"></h2><div id="wins"></div></section>
      <section id="s-inv"><h2 id="h-inv"></h2><div id="inv"></div></section>
      <section><h2 id="h-exp"></h2><div id="jobs"></div></section>
    </main>
    <aside>
      <section><h2 id="h-caps"></h2><div id="skills"></div></section>
      <div class="print-grid">
        <div>
          <section><h2 id="h-edu"></h2><div id="edu"></div></section>
          <section id="s-certs" class="lastsec"><h2 id="h-certs"></h2><ul class="plain" id="certs"></ul></section>
        </div>
        <div>
          <section id="s-pubs"><h2 id="h-pubs"></h2><div id="pubs"></div></section>
          <section id="s-members"><h2 id="h-members"></h2><ul class="plain" id="members"></ul></section>
          <section class="lastsec"><h2 id="h-langs"></h2><div id="langlist"></div></section>
        </div>
      </div>
    </aside>
  </div>
  <footer id="foot"></footer>
</div>

  list("inv", d.inv, r => '<div class="inv"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'); toggle("s-inv", d.inv);
  list("skills", d.skills, g => '<div class="skillgroup"><h3>' + g[0] + '</h3><div class="chips">' + g[1].map(s => "<span>" + s + "</span>").join("") + '</div></div>');
  list("edu", d.edu, e => '<div class="edu"><b>' + e[0] + '</b><span>' + e[1] + '</span></div>');
  list("certs", d.certs, c => "<li>" + c + "</li>"); toggle("s-certs", d.certs);
  list("pubs", d.pubs, p => '<div class="pub">' + (typeof p === "string" ? p : p[0] + '<span>' + p[1] + '</span>') + '</div>'); toggle("s-pubs", d.pubs);
  list("members", d.members, m => "<li>" + m + "</li>"); toggle("s-members", d.members);
  list("langlist", d.langs, l => '<div class="lang"><b style="font-weight:600">' + l[0] + '</b><span>' + l[1] + '</span></div>');

  $("jobs").innerHTML = d.jobs.map(j => {
    let h = '<div class="job"><div class="top"><div class="title">' + j.title + (j.co ? ' · <span class="co">' + j.co + '</span>' : '') + '</div><div class="meta">' + j.meta + '</div></div>';
    if (j.desc) h += '<div class="desc">' + j.desc + '</div>';
    if (j.b && j.b.length) h += "<ul>" + j.b.map(x => "<li>" + x + "</li>").join("") + "</ul>";
    if (j.v && j.v.length) h += '<div class="vent">' + j.v.map(v => '<div class="vrow"><div class="vtitle">' + v[0] + ' · <span class="co2">' + v[1] + '</span><span class="vmeta">' + v[2] + '</span></div><div class="vdesc">' + v[3] + '</div></div>').join("") + '</div>';
    return h + "</div>";
  }).join("");
  const fl = d.contact.filter(c => c.href).map(c => '<a href="' + c.href + '"' + (c.href.indexOf("http") === 0 ? ' target="_blank" rel="noopener"' : '') + '>' + (c.href.indexOf("linkedin") > -1 ? "LinkedIn" : c.t) + '</a>');
  const fparts = d.foot.split(" · ");
  $("foot").innerHTML = '<div class="flinks">' + fl.join('<span class="fsep">·</span>') + '</div><div class="fdate">Gonçalo Moreira Neves · ' + fparts[fparts.length - 1] + '</div>';

  const files = META.ats[state.lang] || META.ats[LANGS[0]];
  $("atsDocx").href = files.docx; $("atsDocx").innerHTML = DOWN + "<span>" + d.ui.atsWord + "</span>";
  $("atsPdf").href = files.pdf;   $("atsPdf").innerHTML  = DOWN + "<span>" + d.ui.atsPdf + "</span>";
  $("printBtn").innerHTML = PRINTER + "<span>" + d.ui.print + "</span>";
  $("printBtn").setAttribute("aria-label", d.ui.print);

  const wrap = $("langs"); wrap.innerHTML = ""; wrap.hidden = LANGS.length < 2;
  LANGS.forEach(code => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = LABELS[code] || code.toUpperCase();
    b.setAttribute("aria-pressed", String(code === state.lang));
    b.setAttribute("aria-label", LABELS[code] || code);
    b.addEventListener("click", () => { state.lang = code; render(); });
    wrap.appendChild(b);
  });
  setTheme(state.theme);
  linkify();
}

/* Link the first mention of each organisation (META.links) in the body. */
function linkify(){
  const L = META.links || {};
  const keys = Object.keys(L).sort((a, b) => b.length - a.length);
  if (!keys.length) return;
  const done = {};
  const walker = document.createTreeWalker(document.querySelector(".body"), NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("a,h2,h3") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    for (const k of keys) {
      if (done[k]) continue;
      const i = node.nodeValue.indexOf(k);
      if (i < 0) continue;
      done[k] = true;
      const rest = node.splitText(i); rest.splitText(k.length);
      const a = document.createElement("a");
      a.href = L[k]; a.target = "_blank"; a.rel = "noopener"; a.className = "org"; a.textContent = k;
      rest.parentNode.replaceChild(a, rest);
      return;
    }
  });
}

if (META.photo) { $("photo").src = META.photo; $("photo").hidden = false; $("mono").hidden = true; }
$("themeBtn").addEventListener("click", () => setTheme(state.theme === "light" ? "dark" : "light"));
$("printBtn").addEventListener("click", () => window.print());
render();
</script>
